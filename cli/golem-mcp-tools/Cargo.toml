[package]
name = "golem-mcp-tools"
version = "0.0.0"
edition = "2021"
authors = ["Golem Cloud"]
license-file = "../../LICENSE"
description = "MCP tools integration for Golem CLI commands"
repository = "https://github.com/golemcloud/golem"
homepage = "https://golem.cloud"

[dependencies]
# Internal dependencies
golem-mcp-types = { workspace = true }
golem-templates = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Process management - use tokio's built-in process support

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Testing
tokio-test = "0.4"
rstest = "0.23.0"
proptest = { workspace = true }

# Development lints
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
# Allow some pedantic lints for development
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"